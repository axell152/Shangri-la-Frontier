<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLF-RPG</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="game-container"></div>

  <!-- Conteneur global en haut à droite -->
  <div style="position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 10;">
    
    <!-- Bloc de l'arme équipée (si tu veux l'intégrer proprement ici) -->
    <div id="equipped-ui" style="background: rgba(0,0,0,0.85); color: white; padding: 12px; font-family: monospace; border-radius: 6px; border: 1px solid #444; pointer-events: auto; min-width: 220px;">
      <h3 style="margin: 0 0 6px 0; font-size: 14px; color: #aaa;">Arme équipée</h3>
      <div id="equipped-weapon-display">Chargement...</div>
    </div>

    <!-- Panneau d'inventaire d'armes -->
    <div id="inventory-ui" style="background: rgba(0,0,0,0.85); color: white; padding: 12px; font-family: monospace; border-radius: 6px; border: 1px solid #444; pointer-events: auto; min-width: 220px;">
      <h3 style="margin: 0 0 8px 0; font-size: 14px; color: #ffb200; border-bottom: 1px solid #444; padding-bottom: 4px;">Inventaire d'armes</h3>
      <div id="weapon-list">Vide</div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
